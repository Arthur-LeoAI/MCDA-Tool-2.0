[project]
name = "mcda-backend"
version = "0.1.0"
description = "MCDA decision-support tool: calculation core and web API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159.1",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcda_core", "src/mcda_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Full-width brackets, colons and commas, and the en dash in ranges, are correct in Chinese text.
allowed-confusables = ["（", "）", "：", "，", "–"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["mcda_core", "mcda_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
