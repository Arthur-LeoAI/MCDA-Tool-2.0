[project]
name = "mcda-backend"
version = "0.1.0"
description = "MCDA decision-support tool: calculation core and web API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159.1",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcda_core", "src/mcda_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
